name: Update Racing Kings data

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_thijs_leaderboards.py'
      - 'scripts/update_lichess_top_players.py'
      - 'scripts/update_peak_lichess_ratings.py'
      - '.github/workflows/update-thijs-leaderboards.yml'

permissions:
  contents: write

concurrency:
  group: racing-kings-data-refresh
  cancel-in-progress: true

jobs:
  update:
    # The generated JSON commit must not start another update loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Thijs tournament leaderboards
        run: python3 scripts/update_thijs_leaderboards.py

      - name: Update Lichess top 20 players
        run: python3 scripts/update_lichess_top_players.py

      - name: Update peak Lichess ratings from Google Sheets
        run: python3 scripts/update_peak_lichess_ratings.py

      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/thijs-leaderboards.json json/lichess-top-players.json json/peak-lichess-ratings.json
          git diff --cached --quiet || git commit -m "Update Racing Kings data"
          git pull --rebase origin main
          git push

      - name: Health check
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          failures = []

          thijs = json.loads(Path("json/thijs-leaderboards.json").read_text(encoding="utf-8"))
          required = {"points", "victories", "maximum", "events", "trophies"}
          successful = set(thijs.get("successfulMetrics", []))
          if successful != required:
              failures.append(
                  "Thijs refresh incomplete: "
                  + ", ".join(sorted(required - successful))
              )
          if thijs.get("errors"):
              failures.append("Thijs errors: " + "; ".join(f"{k}: {v}" for k, v in thijs["errors"].items()))

          top = json.loads(Path("json/lichess-top-players.json").read_text(encoding="utf-8"))
          if len(top.get("players", [])) != 20:
              failures.append(f"Lichess top-player snapshot has {len(top.get('players', []))} players; expected 20")
          if top.get("errors"):
              failures.append("Lichess player errors: " + "; ".join(f"{k}: {v}" for k, v in top["errors"].items()))

          peak = json.loads(Path("json/peak-lichess-ratings.json").read_text(encoding="utf-8"))
          if peak.get("health") == "error":
              failures.append("Peak Lichess rating sheet refresh failed.")
          if not peak.get("players"):
              failures.append("Peak Lichess rating snapshot contains no players.")

          if failures:
              print("\n".join("::warning::" + item for item in failures))
              raise SystemExit(1)

          print("Racing Kings data refresh is healthy: 5 Thijs datasets + 20 Lichess top players + peak-rating sheet snapshot.")
          PY
