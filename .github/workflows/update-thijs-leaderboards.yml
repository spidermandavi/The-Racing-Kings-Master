name: Update Racing Kings tournament leaderboards

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update snapshot
        run: python3 scripts/update_thijs_leaderboards.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/thijs-leaderboards.json
          git diff --cached --quiet || git commit -m "Update Racing Kings tournament leaderboards"
          git push
