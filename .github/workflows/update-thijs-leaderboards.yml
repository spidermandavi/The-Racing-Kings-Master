name: Update Racing Kings tournament leaderboards

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_thijs_leaderboards.py'
      - '.github/workflows/update-thijs-leaderboards.yml'

permissions:
  contents: write

jobs:
  update:
    # The generated JSON commit must not start another update loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update snapshot
        run: python3 scripts/update_thijs_leaderboards.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/thijs-leaderboards.json
          git diff --cached --quiet || git commit -m "Update Racing Kings tournament leaderboards"
          git push
