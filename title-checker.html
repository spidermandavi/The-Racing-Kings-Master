<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Kings Title Checker</title>
<link rel="stylesheet" href="css/global.css">
<style>
.tool{display:flex;flex-direction:column;gap:1rem}.tool-card,.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.6rem}.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.85rem}.field label{font-size:.82rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font:inherit}.calc-btn{width:100%;padding:.8rem 1rem;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 1rem inherit;cursor:pointer}.calc-btn:disabled{opacity:.55;cursor:progress}.ok{color:#4ade80;font-weight:700}.bad{color:#f87171;font-weight:700}.muted{color:var(--text-muted)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem;margin:1rem 0}.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem}.box small{display:block;color:var(--text-muted);text-transform:uppercase;font-size:.72rem}.box strong{display:block;margin-top:.2rem}.req{padding:.7rem 0;border-top:1px solid var(--border)}.req:first-child{border-top:0}.norm{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem;margin:.45rem 0}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:.12rem .5rem;margin:.15rem;font-size:.78rem}.note{margin-top:1rem;padding:.8rem;border-radius:10px;background:var(--surface);color:var(--text-soft)}details{margin-top:1rem}summary{cursor:pointer;font-weight:600}ul{margin:.45rem 0;padding-left:1.25rem}@media(max-width:600px){.tool-card,.result-card{padding:1.1rem}}
</style>
</head>
<body>
<header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button></div></header>
<nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>
<main><div class="tool">
<div class="tool-card"><h1>Racing Kings Title Checker</h1><p>Checks the automatically verifiable Racing Kings title requirements using official Lichess data. Norms require at least 10 games.</p></div>
<div class="tool-card"><form id="checkerForm"><div class="field"><label for="username">Lichess username</label><input id="username" placeholder="e.g. Mysterious_Past" autocomplete="off" required></div><div class="field"><label for="title">Title to check</label><select id="title"><option value="RKCM">RKCM — Candidate Master</option><option value="RKM">RKM — Master</option><option value="RKIM">RKIM — International Master</option><option value="RKGM">RKGM — Grandmaster</option><option value="RKSGM">RKSGM — Super Grandmaster</option><option value="RKV">RKV — Veteran</option><option value="RK Member">RK Member</option><option value="RKHM">RKHM — Honorary Master</option><option value="RKWC">RKWC — World Champion</option></select></div><button class="calc-btn" id="calculateBtn" type="submit">Check requirements</button></form></div>
<div id="result" class="result-card">Enter a username and press Check requirements.</div>
</div></main>
<script>
const API='https://lichess.org/api';
const THREE_MONTHS=1000*60*60*24*30.4375*3;
const RULES={
 RKCM:{games:500,rating:2100,blitz:2,other:2,normPerf:2100},
 RKM:{games:1000,rating:2200,blitz:2,other:2,normPerf:2200},
 RKIM:{games:3000,rating:2300,blitz:1,other:1,normPerf:2300},
 RKGM:{games:5000,rating:2400,blitz:1,other:1,normPerf:2400},
 RKSGM:{games:10000,rating:2500,blitz:1,other:1,normPerf:2450},
 RKV:{games:10000,rating:0,blitz:0,other:0,normPerf:0}
};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isBlitz(tc){const m=String(tc||'').match(/(\d+)\s*(?:\+|\|)\s*(\d+)/);if(!m)return false;const base=+m[1],inc=+m[2];const estimate=base+40*inc;return estimate>0&&estimate<=480;}
function fmtDate(ms){return ms?new Date(ms).toLocaleDateString(): 'Unknown';}
async function fetchJson(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(r.status===429)throw new Error('Lichess rate limit reached. Please wait about one minute and try again.');if(r.status===404)throw new Error('Lichess user or resource not found.');if(!r.ok)throw new Error(`Lichess API request failed (${r.status}).`);return r.json();}
async function getPeakRating(username,current){try{const hist=await fetchJson(`${API}/user/${encodeURIComponent(username)}/rating-history`);const rk=(hist||[]).find(x=>String(x.name||'').toLowerCase().includes('racing'));let peak=current||0;for(const row of rk?.points||[]){if(Array.isArray(row)&&Number.isFinite(row[3]))peak=Math.max(peak,row[3]);}return peak;}catch{return current||0;}}
function accountOldEnough(user){return Number.isFinite(user.createdAt)&&Date.now()-user.createdAt>=THREE_MONTHS;}
function rkGames(user){const p=user.perfs?.racingKings||{};return Number(p.games?.rated??p.games?.total??0);}
function tournamentVariant(t){return String(t.variant?.key||t.variant||t.perf?.key||t.perf||'').toLowerCase().replace(/[^a-z]/g,'');}
function tournamentIsRK(t){const v=tournamentVariant(t);return v==='racingkings'||/racing.?kings/i.test(String(t.fullName||t.name||''));}
function getTournamentGames(t){return Number(t.nbGames??t.games??t.nb??t.performance?.games??0);}
function getTournamentPerf(t){return Number(t.performance??t.perf?.rating??t.perf?.performance??t.performance?.rating??t.rating??0);}
function getTournamentTC(t){return t.clock?.limit!=null?`${Math.round(t.clock.limit/60)}+${t.clock.increment||0}`:(t.clockTime||t.timeControl||t.clock||'');}
async function getTournaments(username){try{return await fetchJson(`${API}/user/${encodeURIComponent(username)}/tournament/played?nb=1000&performance=true`);}catch(e){throw e;}}
function normalizeTournaments(data){if(Array.isArray(data))return data;return data?.created||data?.started||data?.finished||data?.tournaments||[];}
function normInfo(t,threshold){const games=getTournamentGames(t),perf=getTournamentPerf(t),tc=getTournamentTC(t);return tournamentIsRK(t)&&games>=10&&perf>=threshold?{t,games,perf,tc,blitz:isBlitz(tc)}:null;}
function special(title){if(title==='RK Member')return `<h2>RK Member</h2><p>RK Member is no longer based on Lichess statistics. <span class="ok">Registering as a member of the site is the requirement.</span></p>`;if(title==='RKHM')return `<h2>RKHM — Honorary Master</h2><p>This title is not based on automatically fetchable Lichess requirements and must be awarded according to the title system.</p>`;return `<h2>RKWC — World Champion</h2><p>This title is awarded by winning the Racing Kings World Championship and cannot currently be automatically verified by this checker.</p>`;}
function reqRow(label,ok,detail){return `<div class="req"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span> <strong>${esc(label)}</strong><div class="muted">${esc(detail)}</div></div>`;}
$('checkerForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('username').value.trim().replace(/^@/,'');const title=$('title').value;if(!username)return;const button=$('calculateBtn');button.disabled=true;$('result').innerHTML='Checking official Lichess data…';try{if(!RULES[title]){$('result').innerHTML=special(title);return;}const [user,tournamentData]=await Promise.all([fetchJson(`${API}/user/${encodeURIComponent(username)}`),getTournaments(username)]);const rule=RULES[title];const current=Number(user.perfs?.racingKings?.rating||0);const peak=await getPeakRating(user.username||username,current);const games=rkGames(user);const oldEnough=accountOldEnough(user);const norms=normalizeTournaments(tournamentData).map(t=>normInfo(t,rule.normPerf)).filter(Boolean);const blitz=norms.filter(n=>n.blitz);const other=norms.filter(n=>!n.blitz);const accountOk=oldEnough,gameOk=games>=rule.games,ratingOk=peak>=rule.rating||rule.rating===0,blitzOk=blitz.length>=rule.blitz,otherOk=other.length>=rule.other;const normOk=blitzOk&&otherOk;const qualified=accountOk&&gameOk&&ratingOk&&normOk;const titleLabel=title==='RKSGM'?'RKSGM — Super Grandmaster':title;let html=`<h2>${esc(user.username||username)} — ${esc(titleLabel)}</h2><div class="summary"><div class="box"><small>Result</small><strong class="${qualified?'ok':'bad'}">${qualified?'Requirements currently met':'Requirements not yet met'}</strong></div><div class="box"><small>RK rated games</small><strong>${games.toLocaleString()}</strong></div><div class="box"><small>Peak RK rating found</small><strong>${peak||'Unavailable'}</strong></div><div class="box"><small>Account created</small><strong>${fmtDate(user.createdAt)}</strong></div></div>`;html+=reqRow('Account age',accountOk,accountOk?'At least 3 months old.':'Must be at least 3 months old.');html+=reqRow('Rated Racing Kings games',gameOk,`${games.toLocaleString()} / ${rule.games.toLocaleString()} required.`);if(rule.rating)html+=reqRow('Racing Kings rating',ratingOk,`${peak} / ${rule.rating} required (highest rating found in Lichess rating history).`);if(rule.blitz||rule.other){html+=reqRow('Blitz norms',blitzOk,`${blitz.length} / ${rule.blitz} required. Blitz is identified from the tournament time control; every norm must have at least 10 games and performance ${rule.normPerf}+.`);html+=reqRow('Other norms',otherOk,`${other.length} / ${rule.other} required. Any time control qualifies here, but every norm must have at least 10 games and performance ${rule.normPerf}+.`);html+='<details><summary>Qualifying norms found</summary>';if(!norms.length)html+='<p class="muted">No qualifying norms were found in the tournament data returned by Lichess.</p>';else norms.forEach((n,i)=>{html+=`<div class="norm"><strong>${i+1}. ${esc(n.t.fullName||n.t.name||'Tournament')}</strong><br><span class="pill">${n.blitz?'Blitz':'Other'}</span><span class="pill">${n.games} games</span><span class="pill">Performance ${n.perf}</span><span class="pill">${esc(n.tc||'Unknown time control')}</span></div>`;});html+='</details>';}if(title==='RKSGM')html+='<div class="note"><strong>Alternative path:</strong> winning the Racing Kings World Championship can also qualify a player for RKSGM. This checker does not automatically verify that route.</div>';html+='<div class="note">Tournament wins and Shield wins are intentionally not checked: they are no longer title requirements. A norm is counted only when the available Lichess tournament data identifies it as Racing Kings, shows at least 10 games, and shows a performance meeting the title threshold. If Lichess does not return enough historical tournament data for a player, the result should be treated as a conservative automatic check rather than proof that no older norm exists.</div>';$('result').innerHTML=html;}catch(err){$('result').innerHTML=`<h2 class="bad">Check failed</h2><p>${esc(err.message||'Unknown error')}</p>`;}finally{button.disabled=false;}});
</script>
<script src="js/menu.js"></script>
</body></html>
