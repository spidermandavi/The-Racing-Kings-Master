<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Kings Title Checker</title>
<link rel="stylesheet" href="css/global.css">
<style>
.tool{display:flex;flex-direction:column;gap:1rem}.tool-card,.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.6rem}.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.85rem}.field label{font-size:.82rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font:inherit}.calc-btn{width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 1rem inherit;cursor:pointer}.calc-btn:disabled{opacity:.55;cursor:progress}.ok{color:#4ade80;font-weight:700}.bad{color:#f87171;font-weight:700}.muted{color:var(--text-muted)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem;margin:1rem 0}.box,.norm,.note{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem}.box small{display:block;color:var(--text-muted);text-transform:uppercase;font-size:.72rem}.box strong{display:block;margin-top:.2rem}.req{padding:.7rem 0;border-top:1px solid var(--border)}.req:first-child{border-top:0}.norm{margin:.45rem 0}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:.12rem .5rem;margin:.15rem;font-size:.78rem}.note{margin-top:1rem;color:var(--text-soft)}details{margin-top:1rem}summary{cursor:pointer;font-weight:600}@media(max-width:600px){.tool-card,.result-card{padding:1.1rem}}
</style>
</head>
<body>
<header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button></div></header>
<nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>
<main><div class="tool">
<div class="tool-card"><h1>Racing Kings Title Checker</h1><p>Checks automatically verifiable Racing Kings title requirements using official Lichess data. Every norm requires at least 10 games.</p></div>
<div class="tool-card"><form id="checkerForm" novalidate><div class="field"><label for="username">Lichess username</label><input id="username" placeholder="e.g. Mysterious_Past" autocomplete="off" required></div><div class="field"><label for="title">Title to check</label><select id="title"><option value="RKCM">RKCM — Candidate Master</option><option value="RKM">RKM — Master</option><option value="RKIM">RKIM — International Master</option><option value="RKGM">RKGM — Grandmaster</option><option value="RKSGM">RKSGM — Super Grandmaster</option><option value="RKV">RKV — Veteran</option><option value="RK Member">RK Member</option><option value="RKHM">RKHM — Honorary Master</option><option value="RKWC">RKWC — World Champion</option></select></div><button class="calc-btn" id="calculateBtn" type="submit">Check requirements</button></form></div>
<div id="result" class="result-card">Enter a username and press Check requirements.</div>
</div></main>
<script>
const API='https://lichess.org/api',THREE_MONTHS=1000*60*60*24*30.4375*3,MAX_TOURNAMENTS=200;
const RULES={RKCM:{games:500,rating:2100,blitz:2,other:2,normPerf:2100},RKM:{games:1000,rating:2200,blitz:2,other:2,normPerf:2200},RKIM:{games:3000,rating:2300,blitz:1,other:1,normPerf:2300},RKGM:{games:5000,rating:2400,blitz:1,other:1,normPerf:2400},RKSGM:{games:10000,rating:2500,blitz:1,other:1,normPerf:2450},RKV:{games:10000,rating:0,blitz:0,other:0,normPerf:0}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function userPath(u){const c=String(u||'').trim().replace(/^@/,'');if(!/^[A-Za-z0-9_-]{1,40}$/.test(c))throw new Error('Please enter a valid Lichess username.');return encodeURIComponent(c)}
function api(path,params){const u=new URL(path,API+'/');for(const[k,v]of Object.entries(params||{}))u.searchParams.set(k,v);return u}
async function response(url,label,accept='application/json'){let r;try{r=await fetch(url,{headers:{Accept:accept}})}catch(e){throw new Error(`${label} could not be reached.`)}if(r.status===429)throw new Error(`${label}: Lichess rate limit reached. Please wait and try again.`);if(r.status===404)throw new Error(`${label}: user or resource not found.`);if(!r.ok)throw new Error(`${label}: request failed (${r.status}).`);return r}
async function json(url,label){return(await response(url,label)).json()}
async function getUser(u){return json(api(`user/${userPath(u)}`),'User lookup')}
async function getPerf(u){const r=await response(api(`user/${userPath(u)}/perf/racingKings`),'Racing Kings performance');return r.json()}
function parseNDJSON(text){return text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>JSON.parse(line))}
async function getTournaments(u){const r=await response(api(`user/${userPath(u)}/tournament/played`,{nb:MAX_TOURNAMENTS,performance:true}),'Tournament history','application/x-ndjson, application/json;q=0.9');const text=await r.text();if(!text.trim())return[];try{return JSON.parse(text)}catch{return parseNDJSON(text)}}
function games(user,perf){const n=perf?.stat?.count?.rated??0;return Number(n)||0}
function oldEnough(u){return Number(u.createdAt)>0&&Date.now()-Number(u.createdAt)>=THREE_MONTHS}
function normalizePlayedTournament(entry){const tournament=entry?.tournament||{};const player=entry?.player||{};return{tournament,player,rank:Number(player.rank??0)||0,score:Number(player.score??0)||0,nbGames:Number(player.games??0)||0,performance:Number(player.performance??0)||0}}
function racingKingsOnly(entries){return entries.map(normalizePlayedTournament).filter(t=>t.tournament?.perf?.key==='racingKings')}
function sortByPerformanceDesc(entries){return [...entries].sort((a,b)=>(b.performance??0)-(a.performance??0))}
function timeControl(t){const clock=t?.tournament?.clock||t?.tournament?.clockTime||t?.tournament?.timeControl||'';if(typeof clock==='string')return clock;if(clock&&typeof clock==='object'&&clock.limit!=null)return `${Math.max(1,Math.round(Number(clock.limit)/60))}+${Number(clock.increment)||0}`;return String(clock||'')}
function isBlitzTimeControl(tc){const m=String(tc||'').match(/(\d+)\s*(?:\+|\|)\s*(\d+)/);if(!m)return false;const base=Number(m[1]),inc=Number(m[2]);const estimated=base+40*inc;return estimated>0&&estimated<=480}
function normInfo(t,threshold){if(!t||t.performance<threshold||t.nbGames<10)return null;const tc=timeControl(t);return{t,g:t.nbGames,p:t.performance,c:tc,blitz:isBlitzTimeControl(tc)}}
function row(label,ok,detail){return`<div class="req"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span> <strong>${esc(label)}</strong><div class="muted">${esc(detail)}</div></div>`}
function special(t){if(t==='RK Member')return'<h2>RK Member</h2><p><span class="ok">Registering as a member of the site is the requirement.</span></p>';if(t==='RKHM')return'<h2>RKHM — Honorary Master</h2><p>This title must be awarded according to the title system.</p>';return'<h2>RKWC — World Champion</h2><p>This title is awarded by winning the Racing Kings World Championship and cannot currently be automatically verified.</p>'}
$('checkerForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('username').value.trim().replace(/^@/,''),title=$('title').value,b=$('calculateBtn');if(!username){$('result').innerHTML='<h2 class="bad">Enter a username</h2>';return}b.disabled=true;$('result').textContent='Checking official Lichess data…';try{if(!RULES[title]){$('result').innerHTML=special(title);return}const rule=RULES[title];const[user,perf,tournamentData]=await Promise.all([getUser(username),getPerf(username),getTournaments(username)]);const peak=Number(perf?.stat?.highest?.int);if(!Number.isFinite(peak)||peak<=0)throw new Error('Lichess did not return a peak Racing Kings rating for this account.');const g=games(user,perf),age=oldEnough(user);const rkTournaments=racingKingsOnly(Array.isArray(tournamentData)?tournamentData:[]);const sortedTournaments=sortByPerformanceDesc(rkTournaments);const norms=sortedTournaments.map(t=>normInfo(t,rule.normPerf)).filter(Boolean);const blitz=norms.filter(n=>n.blitz),other=norms.filter(n=>!n.blitz);const gameOk=g>=rule.games,ratingOk=!rule.rating||peak>=rule.rating,blitzOk=blitz.length>=rule.blitz,otherOk=other.length>=rule.other,qualified=age&&gameOk&&ratingOk&&blitzOk&&otherOk;let h=`<h2>${esc(user.username||username)} — ${esc(title)}</h2><div class="summary"><div class="box"><small>Result</small><strong class="${qualified?'ok':'bad'}">${qualified?'Requirements currently met':'Requirements not yet met'}</strong></div><div class="box"><small>RK rated games</small><strong>${g.toLocaleString()}</strong></div><div class="box"><small>Peak RK rating</small><strong>${peak}</strong><span class="muted">Official Lichess performance peak</span></div><div class="box"><small>RK tournaments scanned</small><strong>${rkTournaments.length}</strong><span class="muted">Racing Kings entries returned by Lichess</span></div></div>`;h+=row('Account age',age,age?'At least 3 months old.':'Must be at least 3 months old.');h+=row('Rated Racing Kings games',gameOk,`${g.toLocaleString()} / ${rule.games.toLocaleString()} required.`);if(rule.rating)h+=row('Racing Kings peak rating',ratingOk,`${peak} / ${rule.rating} required. Uses the same stat.highest.int value as the Profile page.`);if(rule.blitz||rule.other){h+=row('Blitz norms',blitzOk,`${blitz.length} / ${rule.blitz} required. Norm = Racing Kings tournament, at least 10 games, performance ${rule.normPerf}+, then classified as blitz from its time control.`);h+=row('Other norms',otherOk,`${other.length} / ${rule.other} required. Norm = Racing Kings tournament, at least 10 games, performance ${rule.normPerf}+, not classified as blitz.`)}h+='<details open><summary>Qualifying norms found</summary>';h+=norms.length?norms.map((n,i)=>`<div class="norm"><strong>${i+1}. ${esc(n.t.tournament?.fullName||n.t.tournament?.name||n.t.tournament?.id||'Tournament')}</strong><br><span class="pill">${n.blitz?'Blitz':'Other'}</span><span class="pill">${n.g} games</span><span class="pill">Performance ${n.p}</span><span class="pill">${esc(n.c||'Unknown time control')}</span>${n.t.rank===1?'<span class="pill">Won</span>':''}</div>`).join(''):'<p class="muted">No qualifying norms were found. The checker only counts entries with tournament.perf.key exactly equal to racingKings, player.games at least 10, and player.performance at or above the selected title threshold.</p>';h+='</details>';if(title!=='RKV')h+=`<div class="note">Fetched up to ${MAX_TOURNAMENTS} played tournaments from Lichess and evaluated the Racing Kings records in descending performance order. This preserves the proven norm-selection order used by the older checker.</div>`;$('result').innerHTML=h}catch(err){$('result').innerHTML=`<h2 class="bad">Check failed</h2><p>${esc(err.message||'Unknown error')}</p>`}finally{b.disabled=false}});
</script>
<script src="js/menu.js"></script>
</body>
</html>
