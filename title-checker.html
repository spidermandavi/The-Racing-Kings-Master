<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Racing Kings Title Checker</title><link rel="stylesheet" href="css/global.css"><style>.tool{display:flex;flex-direction:column;gap:1rem}.tool-card,.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.6rem}.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.85rem}.field label{font-size:.82rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font:inherit}.calc-btn{width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 1rem inherit;cursor:pointer}.calc-btn:disabled{opacity:.55;cursor:progress}.ok{color:#4ade80;font-weight:700}.bad{color:#f87171;font-weight:700}.muted{color:var(--text-muted)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem;margin:1rem 0}.box,.norm,.note{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem}.box small{display:block;color:var(--text-muted);text-transform:uppercase;font-size:.72rem}.box strong{display:block;margin-top:.2rem}.req{padding:.7rem 0;border-top:1px solid var(--border)}.req:first-child{border-top:0}.norm{margin:.45rem 0}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:.12rem .5rem;margin:.15rem;font-size:.78rem}.note{margin-top:1rem;color:var(--text-soft)}details{margin-top:1rem}summary{cursor:pointer;font-weight:600}@media(max-width:600px){.tool-card,.result-card{padding:1.1rem}}</style></head><body>
<header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button></div></header><nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>
<main><div class="tool"><div class="tool-card"><h1>Racing Kings Title Checker</h1><p>Checks automatically verifiable Racing Kings title requirements using official Lichess data. Every norm requires at least 10 games.</p></div><div class="tool-card"><form id="checkerForm" novalidate><div class="field"><label for="username">Lichess username</label><input id="username" placeholder="e.g. Mysterious_Past" autocomplete="off" required></div><div class="field"><label for="title">Title to check</label><select id="title"><option value="RKCM">RKCM — Candidate Master</option><option value="RKM">RKM — Master</option><option value="RKIM">RKIM — International Master</option><option value="RKGM">RKGM — Grandmaster</option><option value="RKSGM">RKSGM — Super Grandmaster</option><option value="RKV">RKV — Veteran</option><option value="RK Member">RK Member</option><option value="RKHM">RKHM — Honorary Master</option><option value="RKWC">RKWC — World Champion</option></select></div><button class="calc-btn" id="calculateBtn" type="submit">Check requirements</button></form></div><div id="result" class="result-card">Enter a username and press Check requirements.</div></div></main>
<script>
const API='https://lichess.org/api',THREE_MONTHS=1000*60*60*24*30.4375*3;
const RULES={RKCM:{games:500,rating:2100,blitz:2,other:2,normPerf:2100},RKM:{games:1000,rating:2200,blitz:2,other:2,normPerf:2200},RKIM:{games:3000,rating:2300,blitz:1,other:1,normPerf:2300},RKGM:{games:5000,rating:2400,blitz:1,other:1,normPerf:2400},RKSGM:{games:10000,rating:2500,blitz:1,other:1,normPerf:2450},RKV:{games:10000,rating:0,blitz:0,other:0,normPerf:0}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function userPath(u){const c=String(u||'').trim().replace(/^@/,'');if(!/^[A-Za-z0-9_-]{1,40}$/.test(c))throw new Error('Please enter a valid Lichess username.');return encodeURIComponent(c)}
function api(path,params){const u=new URL(path,API+'/');for(const[k,v]of Object.entries(params||{}))u.searchParams.set(k,v);return u}
async function response(url,label,accept='application/json'){let r;try{r=await fetch(url,{headers:{Accept:accept}})}catch(e){throw new Error(`${label} could not be reached.`)}if(r.status===429)throw new Error(`${label}: Lichess rate limit reached. Please wait and try again.`);if(r.status===404)throw new Error(`${label}: user or resource not found.`);if(!r.ok)throw new Error(`${label}: request failed (${r.status}).`);return r}
async function json(url,label){return(await response(url,label)).json()}
async function getUser(u){return json(api(`user/${userPath(u)}`),'User lookup')}
async function getPerf(u){const r=await response(api(`user/${userPath(u)}/perf/racingKings`),'Racing Kings performance');return r.json()}
async function getTournaments(u){const r=await response(api(`user/${userPath(u)}/tournament/played`,{nb:1000,performance:true}),'Tournament history','application/json, application/x-ndjson');const t=await r.text();if(!t.trim())return[];try{return JSON.parse(t)}catch{return t.trim().split(/\r?\n/).filter(Boolean).map(x=>JSON.parse(x))}}
function games(user,perf){const n=perf?.stat?.count?.rated??0;return Number(n)||0}
function oldEnough(u){return Number(u.createdAt)&&Date.now()-Number(u.createdAt)>=THREE_MONTHS}
function normList(data){if(Array.isArray(data))return data;if(Array.isArray(data?.created))return data.created;if(Array.isArray(data?.started))return data.started;if(Array.isArray(data?.finished))return data.finished;if(Array.isArray(data?.tournaments))return data.tournaments;return[]}
function isRK(t){const v=String(t.variant?.key||t.variant||t.perf?.key||t.perf||'').toLowerCase().replace(/[^a-z]/g,'');return v==='racingkings'||/racing.?kings/i.test(String(t.fullName||t.name||''))}
function info(t,threshold){const g=Number(t.nbGames??t.games??t.nb??t.performance?.games??0)||0,p=Number(t.performance?.rating??t.perf?.rating??t.rating??0)||0;if(!isRK(t)||g<10||p<threshold)return null;const c=t.clock?.limit!=null?`${Math.max(1,Math.round(Number(t.clock.limit)/60))}+${Number(t.clock.increment)||0}`:String(t.clockTime||t.timeControl||'');const m=c.match(/(\d+)\s*\+\s*(\d+)/),speed=m?(+m[1]+40*+m[2]):Infinity;return{t,g,p,c,blitz:speed>0&&speed<=480}}
function row(label,ok,detail){return`<div class="req"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span> <strong>${esc(label)}</strong><div class="muted">${esc(detail)}</div></div>`}
function special(t){if(t==='RK Member')return'<h2>RK Member</h2><p><span class="ok">Registering as a member of the site is the requirement.</span></p>';if(t==='RKHM')return'<h2>RKHM — Honorary Master</h2><p>This title must be awarded according to the title system.</p>';return'<h2>RKWC — World Champion</h2><p>This title is awarded by winning the Racing Kings World Championship and cannot currently be automatically verified.</p>'}
$('checkerForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('username').value.trim().replace(/^@/,''),title=$('title').value,b=$('calculateBtn');if(!username){$('result').innerHTML='<h2 class="bad">Enter a username</h2>';return}b.disabled=true;$('result').textContent='Checking official Lichess data…';try{if(!RULES[title]){$('result').innerHTML=special(title);return}const rule=RULES[title];const[user,perf,tournamentData]=await Promise.all([getUser(username),getPerf(username),getTournaments(username)]);const peak=Number(perf?.stat?.highest?.int);if(!Number.isFinite(peak)||peak<=0)throw new Error('Lichess did not return a peak Racing Kings rating for this account.');const g=games(user,perf),age=oldEnough(user),norms=normList(tournamentData).map(t=>info(t,rule.normPerf)).filter(Boolean),blitz=norms.filter(n=>n.blitz),other=norms.filter(n=>!n.blitz);const gameOk=g>=rule.games,ratingOk=!rule.rating||peak>=rule.rating,blitzOk=blitz.length>=rule.blitz,otherOk=other.length>=rule.other,qualified=age&&gameOk&&ratingOk&&blitzOk&&otherOk;let h=`<h2>${esc(user.username||username)} — ${esc(title)}</h2><div class="summary"><div class="box"><small>Result</small><strong class="${qualified?'ok':'bad'}">${qualified?'Requirements currently met':'Requirements not yet met'}</strong></div><div class="box"><small>RK rated games</small><strong>${g.toLocaleString()}</strong></div><div class="box"><small>Peak RK rating</small><strong>${peak}</strong><span class="muted">Official Lichess performance peak</span></div><div class="box"><small>Account created</small><strong>${user.createdAt?new Date(user.createdAt).toLocaleDateString():'Unknown'}</strong></div></div>`;h+=row('Account age',age,age?'At least 3 months old.':'Must be at least 3 months old.');h+=row('Rated Racing Kings games',gameOk,`${g.toLocaleString()} / ${rule.games.toLocaleString()} required.`);if(rule.rating)h+=row('Racing Kings peak rating',ratingOk,`${peak} / ${rule.rating} required. Uses the same stat.highest.int value as the Profile page.`);if(rule.blitz||rule.other){h+=row('Blitz norms',blitzOk,`${blitz.length} / ${rule.blitz} required. At least 10 games and performance ${rule.normPerf}+ per norm.`);h+=row('Other norms',otherOk,`${other.length} / ${rule.other} required. At least 10 games and performance ${rule.normPerf}+ per norm.`)}h+='<details><summary>Qualifying norms found</summary>';h+=norms.length?norms.map((n,i)=>`<div class="norm"><strong>${i+1}. ${esc(n.t.fullName||n.t.name||'Tournament')}</strong><br><span class="pill">${n.blitz?'Blitz':'Other'}</span><span class="pill">${n.g} games</span><span class="pill">Performance ${n.p}</span><span class="pill">${esc(n.c||'Unknown time control')}</span></div>`).join(''):'<p class="muted">No qualifying norms were found.</p>';h+='</details>';$('result').innerHTML=h}catch(err){$('result').innerHTML=`<h2 class="bad">Check failed</h2><p>${esc(err.message||'Unknown error')}</p>`}finally{b.disabled=false}});
</script><script src="js/menu.js"></script></body></html>
