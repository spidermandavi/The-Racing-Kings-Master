<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Racing Kings Title Checker</title><link rel="stylesheet" href="css/global.css"><script src="js/title-rules.js"></script><style>.tool{display:flex;flex-direction:column;gap:1rem}.tool-card,.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.6rem}.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.85rem}.field label{font-size:.82rem;color:var(--text-muted);text-transform:uppercase}.field input,.field select{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font:inherit}.calc-btn{width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 1rem inherit;cursor:pointer}.calc-btn:disabled{opacity:.55}.ok{color:#4ade80;font-weight:700}.bad{color:#f87171;font-weight:700}.muted{color:var(--text-muted)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem;margin:1rem 0}.box,.norm,.note{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem}.box small{display:block;color:var(--text-muted);text-transform:uppercase;font-size:.72rem}.box strong{display:block;margin-top:.2rem}.req{padding:.7rem 0;border-top:1px solid var(--border)}.req:first-child{border-top:0}.norm{margin:.45rem 0}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:.12rem .5rem;margin:.15rem;font-size:.78rem}.note{margin-top:1rem;color:var(--text-soft)}details{margin-top:1rem}summary{cursor:pointer;font-weight:600}</style></head>
<body><header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button></div></header><nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav><main><div class="tool"><div class="tool-card"><h1>Racing Kings Title Checker</h1><p>Checks automatically verifiable Racing Kings title requirements using the canonical site rules. Every norm requires at least 10 games.</p></div><div class="tool-card"><form id="checkerForm"><div class="field"><label for="username">Lichess username</label><input id="username" placeholder="e.g. Mysterious_Past" required></div><div class="field"><label for="title">Title to check</label><select id="title"></select></div><button class="calc-btn" id="calculateBtn">Check requirements</button></form></div><div id="result" class="result-card">Enter a username and press Check requirements.</div></div></main>
<script>
const API='https://lichess.org/api'; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
TITLE_RULES.order.forEach(code=>{const d=TITLE_RULES.get(code);const o=document.createElement('option');o.value=code;o.textContent=`${code} — ${d.name}`;if(d.adminAwarded)o.textContent+=' — admin awarded';$('title').appendChild(o)});
function normalizeClock(clock){if(!clock)return '';if(typeof clock==='string')return clock.replace(/\s+/g,'');if(clock.limit==null)return '';return `${Math.max(0,Math.round(Number(clock.limit)/60))}+${Number(clock.increment||0)}`;}
async function json(url,label){let r;try{r=await fetch(url)}catch{throw new Error(`${label} could not be reached.`)}if(r.status===429)throw new Error(`${label}: Lichess rate limit reached.`);if(!r.ok)throw new Error(`${label}: request failed (${r.status}).`);return r.json()}
async function played(u){const r=await fetch(`${API}/user/${encodeURIComponent(u)}/tournament/played?nb=1000&performance=true`,{headers:{Accept:'application/x-ndjson, application/json;q=0.9'}});if(r.status===429)throw new Error('Lichess rate limit reached while scanning tournaments.');if(!r.ok)throw new Error(`Tournament scan failed (${r.status}).`);const text=await r.text();if(!text.trim())return[];try{return JSON.parse(text)}catch{return text.split(/\r?\n/).filter(Boolean).map(JSON.parse)}}
async function qualify(entry){const t=entry?.tournament||{};const id=t.id||entry?.id;if(!id)return null;let rated=t.rated===true,variant=t.perf?.key||t.variant?.key||'',clock=normalizeClock(t.clock);if(!rated||variant!=='racingKings'||!clock){let m;try{m=await json(`${API}/tournament/${encodeURIComponent(id)}`,'Tournament metadata')}catch{return null}rated=rated||m.rated===true;variant=variant||m.perf?.key||m.variant?.key||'';clock=clock||normalizeClock(m.clock)}if(rated!==true||variant!=='racingKings'||!clock)return null;const games=Number(entry?.player?.games??0)||0,perf=Number(entry?.player?.performance??0)||0;if(games<TITLE_RULES.universal.minNormGames||perf<=0)return null;return{id,name:t.fullName||t.name||id,games,perf,clock,blitz:TITLE_RULES.isBlitzControl(clock)}}
function row(label,ok,detail){return`<div class="req"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span> <strong>${esc(label)}</strong><div class="muted">${esc(detail)}</div></div>`}
$('checkerForm').addEventListener('submit',async e=>{e.preventDefault();const u=$('username').value.trim().replace(/^@/,'');const code=$('title').value;const d=TITLE_RULES.get(code),b=$('calculateBtn');if(!/^[A-Za-z0-9_-]{1,40}$/.test(u)){$('result').innerHTML='<h2 class="bad">Enter a valid Lichess username.</h2>';return}if(d.adminAwarded){$('result').innerHTML=`<h2>${esc(code)}</h2><p class="muted">${esc(code)} is an administrator-awarded title/recognition and cannot be automatically verified.</p>`;return}b.disabled=true;$('result').textContent='Checking official Lichess data…';try{const [user,perf,raw]=await Promise.all([json(`${API}/user/${encodeURIComponent(u)}`,'User lookup'),json(`${API}/user/${encodeURIComponent(u)}/perf/racingKings`,'Racing Kings performance'),played(u)]);const games=Number(perf?.stat?.count?.rated??0)||0;const peak=Number(perf?.stat?.highest?.int??0)||0;const ageOk=!!user.createdAt&&Date.now()-Number(user.createdAt)>=TITLE_RULES.universal.accountAgeDays*86400000;const qualifying=[];for(const entry of Array.isArray(raw)?raw:[]){const n=await qualify(entry);if(n)qualifying.push(n)}const threshold=d.norms?.performance??0;const eligible=qualifying.filter(n=>n.perf>=threshold);const blitz=eligible.filter(n=>n.blitz);const standard=eligible.filter(n=>!n.blitz);let qualifiedTitle=ageOk&&games>=d.ratedGames;if(code!=='RKV'){qualifiedTitle=qualifiedTitle&&peak>=d.rating&&blitz.length>=d.norms.blitz&&standard.length>=d.norms.standard}const render=`<h2>${esc(user.username)} — ${esc(code)}</h2>`;let h=render+`<div class="summary"><div class="box"><small>Result</small><strong class="${qualifiedTitle?'ok':'bad'}">${qualifiedTitle?'Eligible':'Requirements not fully verified'}</strong></div><div class="box"><small>Rated RK games</small><strong>${games.toLocaleString()}</strong></div><div class="box"><small>Peak RK rating</small><strong>${peak||'N/A'}</strong></div><div class="box"><small>Qualifying tournaments</small><strong>${qualifying.length}</strong></div></div>`;h+=row('Account age',ageOk,ageOk?'At least 3 months old.':'Account must be at least 3 months old.');h+=row('Rated Racing Kings games',games>=d.ratedGames,`${games.toLocaleString()} / ${d.ratedGames.toLocaleString()} required.`);if(code!=='RKV'){h+=row('Peak Racing Kings rating',peak>=d.rating,`${peak} / ${d.rating} required.`);h+=row('Blitz norms',blitz.length>=d.norms.blitz,`${blitz.length} / ${d.norms.blitz} required. Blitz controls are exactly 3+0, 3+2, or 5+0; each norm needs ${d.norms.performance}+ performance and 10+ games.`);h+=row('Standard norms',standard.length>=d.norms.standard,`${standard.length} / ${d.norms.standard} required. Standard means a qualifying Racing Kings tournament that is not 3+0, 3+2, or 5+0; each norm needs ${d.norms.performance}+ performance and 10+ games.`)}if(code==='RKV'){const rh=await json(`${API}/user/${encodeURIComponent(u)}/rating-history`,'Rating history');const rkHist=Array.isArray(rh)?rh.find(x=>x.name==='Racing Kings'):null;const pts=rkHist?.points||[];const cutoff=new Date();cutoff.setFullYear(cutoff.getFullYear()-5);const historyRoute=pts.length>0&&new Date(pts[0][0],pts[0][1],pts[0][2])<=cutoff;const veteranEligible=ageOk&&(games>=d.ratedGames||historyRoute);h=h.replace('Requirements not fully verified',veteranEligible?'Eligible':'Requirements not fully verified').replace('class="bad">Eligible','class="ok">Eligible');h+=row('Five-year Racing Kings history',historyRoute,historyRoute?'Verified from actual Racing Kings rating history.':'No five-year Racing Kings history was verified. This is not inferred from account age.')}h+='<details open><summary>Qualifying tournaments found</summary>';h+=eligible.length?eligible.map(n=>`<div class="norm"><strong>${esc(n.name)}</strong><br><span class="pill">${n.blitz?'Blitz':'Standard'}</span><span class="pill">${n.games} games</span><span class="pill">Performance ${n.perf}</span><span class="pill">${esc(n.clock)}</span></div>`).join(''):'<p class="muted">No qualifying norms were found.</p>';h+='</details><div class="note">Norms are matched by distinct qualifying Racing Kings tournaments. Winning the tournament is not required.</div>';$('result').innerHTML=h}catch(err){$('result').innerHTML=`<h2 class="bad">Check failed</h2><p>${esc(err.message)}</p>`}finally{b.disabled=false}});
</script><script src="js/menu.js"></script></body></html>
