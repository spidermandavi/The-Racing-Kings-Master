<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Racing Kings Titles - Profile</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .profile-wrap {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Search card */
    .search-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
    }

    .search-card h1 { margin-bottom: 0.4rem; }
    .search-card > p { margin-bottom: 1.1rem; }

    .profile-form {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .profile-form input {
      flex: 1;
      min-width: 160px;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .profile-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .profile-form button {
      padding: 0.65rem 1.4rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .profile-form button:hover:not(:disabled) {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .profile-form button:active { transform: scale(0.97); }
    .profile-form button:disabled { opacity: 0.55; cursor: progress; }

    .status-msg {
      margin-top: 0.7rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    .status-msg.error { color: #f87171; }

    /* Section card */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      animation: fadeInUp 0.35s ease both;
    }

    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* Profile header */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .profile-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--card-raised), var(--accent));
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .profile-name-block { flex: 1; min-width: 0; }

    .profile-username {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .lichess-title-badge {
      background: #7c3aed;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.18rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    .profile-meta {
      margin-top: 0.25rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .profile-lichess-link {
      margin-left: auto;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .profile-lichess-link:hover { opacity: 0.75; text-decoration: underline; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
    }

    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .stat-label {
      font-size: 0.71rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .stat-value.highlight { color: var(--gold); }

    /* Site title badges */
    .site-titles-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .site-title-badge {
      padding: 0.32rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .badge-elite     { background: #7c3aed; color: #fff; }
    .badge-grand     { background: #dc2626; color: #fff; }
    .badge-master    { background: #2563eb; color: #fff; }
    .badge-candidate { background: #0891b2; color: #fff; }
    .badge-clight    { background: #0f766e; color: #fff; }
    .badge-special   { background: #f59e0b; color: #000; }
    .badge-veteran   { background: #6b7280; color: #fff; }

    .since-label { font-size: 0.75rem; opacity: 0.7; margin-left: 0.2rem; }
    .no-titles { color: var(--text-muted); font-style: italic; font-size: 0.88rem; }

    /* Eligibility */
    .elig-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 1rem;
    }

    .elig-list { display: flex; flex-direction: column; gap: 1rem; }

    .elig-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0;
    }

    .elig-item { display: flex; flex-direction: column; gap: 0.5rem; }

    .elig-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .elig-badge {
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .elig-title-name { font-size: 0.88rem; color: var(--text-soft); }

    .elig-check {
      margin-left: auto;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .elig-check.met   { color: #4ade80; }
    .elig-check.unmet { color: var(--text-muted); }

    .elig-reqs {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding-left: 0.4rem;
    }

    .elig-req-row { display: flex; flex-direction: column; gap: 0.18rem; }

    .elig-req-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .elig-req-text  { color: var(--text-muted); }
    .elig-req-val   { font-weight: 600; }
    .elig-req-val.met   { color: #4ade80; }
    .elig-req-val.unmet { color: var(--text-muted); }

    .progress-bar {
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.6s ease;
    }

    .progress-fill.done { background: #4ade80; }

    @media (max-width: 600px) {
      .search-card { padding: 1.1rem; }
      .section-card { padding: 1rem; }
      .stats-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .profile-username { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="nav-left">
    <button class="icon-btn" id="backBtn" aria-label="Go back">&lt;</button>
    <button class="icon-btn" id="forwardBtn" aria-label="Go forward">&gt;</button>
  </div>
  <div class="nav-right">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
  </div>
</header>

<nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>

<main>
  <div class="profile-wrap">
    <div class="search-card">
      <h1>Profile Lookup</h1>
      <p>Enter a Lichess username to view their Racing Kings stats, titles, and eligibility progress.</p>
      <form class="profile-form" id="profileForm">
        <input id="usernameInput" type="search" autocomplete="off"
               placeholder="e.g. Mysterious_Past" required />
        <button type="submit" id="loadBtn">Load Profile</button>
      </form>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div id="profileOutput" hidden>
      <div class="section-card" id="profileHeader"></div>
      <div class="section-card" style="margin-top:0">
        <div class="section-title">Racing Kings Stats</div>
        <div class="stats-grid" id="statsGrid"></div>
      </div>
      <div class="section-card" style="margin-top:0">
        <div class="section-title">Site Titles Held</div>
        <div id="siteTitlesContent"></div>
      </div>
      <div class="section-card" style="margin-top:0">
        <div class="section-title">Title Eligibility Progress</div>
        <p class="elig-note">Based on games played and peak rating. Tournament requirements need manual verification.</p>
        <div class="elig-list" id="eligList"></div>
      </div>
    </div>
  </div>
</main>

<script>
const STORAGE_KEY = "rk_profile_username";

const TITLE_DEFS = [
  { code: "RKSGM", name: "Super Grandmaster",    badgeClass: "badge-elite",     minGames: 5000,  minRating: 2500 },
  { code: "RKGM",  name: "Grandmaster",          badgeClass: "badge-grand",     minGames: 3000,  minRating: 2400 },
  { code: "RKIM",  name: "International Master", badgeClass: "badge-master",    minGames: 2000,  minRating: 2300 },
  { code: "RKM",   name: "Master",               badgeClass: "badge-candidate", minGames: 1000,  minRating: 2200 },
  { code: "RKCM",  name: "Candidate Master",     badgeClass: "badge-clight",    minGames: 500,   minRating: 2100 },
  { code: "RKV",   name: "Veteran",              badgeClass: "badge-veteran",   minGames: 10000, minRating: 0 }
];

const BADGE_MAP = {
  RKWC: "badge-special", RKSGM: "badge-elite", RKGM: "badge-grand",
  RKIM: "badge-master", RKM: "badge-candidate", RKCM: "badge-clight",
  RKV: "badge-veteran", RKHM: "badge-special"
};

const form        = document.getElementById("profileForm");
const input       = document.getElementById("usernameInput");
const loadBtn     = document.getElementById("loadBtn");
const statusMsg   = document.getElementById("statusMsg");
const output      = document.getElementById("profileOutput");
const headerEl    = document.getElementById("profileHeader");
const statsGridEl = document.getElementById("statsGrid");
const siteTitlesEl= document.getElementById("siteTitlesContent");
const eligListEl  = document.getElementById("eligList");

function setStatus(text, isError = false) {
  statusMsg.textContent = text;
  statusMsg.className = "status-msg" + (isError ? " error" : "");
}

function getFlagEmoji(code) {
  if (!code || code.length !== 2) return "";
  return code.toUpperCase().split("")
    .map(c => String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65))
    .join("");
}

function pct(val, max) {
  if (!max) return 100;
  return Math.min(100, Math.round((val / max) * 100));
}

function statItem(label, value, highlight = false) {
  return `<div class="stat-item">
    <span class="stat-label">${label}</span>
    <span class="stat-value${highlight ? " highlight" : ""}">${value}</span>
  </div>`;
}

function progressRow(label, current, required) {
  const done = current >= required;
  const fill = pct(current, required);
  return `<div class="elig-req-row">
    <div class="elig-req-label">
      <span class="elig-req-text">${label}</span>
      <span class="elig-req-val ${done ? "met" : "unmet"}">
        ${current.toLocaleString()} / ${required.toLocaleString()}
      </span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill ${done ? "done" : ""}" style="width:${fill}%"></div>
    </div>
  </div>`;
}

async function loadPlayers() {
  try {
    const res = await fetch("players.json");
    return await res.json();
  } catch { return []; }
}

async function loadProfile(rawUsername) {
  const username = rawUsername.trim();
  if (!username) { setStatus("Please enter a username.", true); return; }

  localStorage.setItem(STORAGE_KEY, username);
  output.hidden = true;
  setStatus("Loading…");
  loadBtn.disabled = true;

  try {
    const [userRes, perfRes, players, topRes] = await Promise.all([
      fetch(`https://lichess.org/api/user/${encodeURIComponent(username)}`),
      fetch(`https://lichess.org/api/user/${encodeURIComponent(username)}/perf/racingKings`),
      loadPlayers(),
      fetch("https://lichess.org/api/player/top/200/racingKings", { headers: { Accept: "application/json" } })
    ]);

    if (!userRes.ok) throw new Error("User not found on Lichess.");

    const user    = await userRes.json();
    const perf    = perfRes.ok ? await perfRes.json() : null;
    const topData = topRes.ok  ? await topRes.json()  : null;

    const rk          = user.perfs?.racingKings || {};
    const stat        = perf?.stat || {};
    const count       = stat.count || {};
    const games       = count.all ?? rk.games ?? 0;
    const wins        = count.win ?? 0;
    const losses      = count.loss ?? 0;
    const draws       = count.draw ?? 0;
    const peakRating  = stat.highest?.int ?? rk.rating ?? 0;
    const curRating   = rk.rating ?? 0;
    const winRate     = games ? ((wins / games) * 100).toFixed(1) + "%" : "N/A";
    const memberYear  = user.createdAt ? new Date(user.createdAt).getFullYear() : "N/A";
    const flag        = getFlagEmoji(user.profile?.country || "");
    const lichessTitle = user.title || null;
    const bestStreak  = stat.currentResultStreak?.wins?.v ?? stat.maxResultStreak?.wins?.v ?? null;

    const topUsers = topData?.users || [];
    const rankIdx  = topUsers.findIndex(u => u.id?.toLowerCase() === user.id?.toLowerCase());
    const rank     = rankIdx >= 0 ? `#${rankIdx + 1} of top 200` : "Outside top 200";

    const siteRecord = players.find(
      p => p.username?.toLowerCase() === user.id?.toLowerCase()
        || p.username?.toLowerCase() === user.username?.toLowerCase()
    );
    const siteTitleList = siteRecord?.titles || [];

    // Header
    headerEl.innerHTML = `
      <div class="section-title">Player</div>
      <div class="profile-header">
        <div class="profile-avatar">${(user.username || "?")[0].toUpperCase()}</div>
        <div class="profile-name-block">
          <div class="profile-username">
            ${flag ? `<span>${flag}</span>` : ""}
            ${user.username}
            ${lichessTitle ? `<span class="lichess-title-badge">${lichessTitle}</span>` : ""}
          </div>
          <div class="profile-meta">
            Member since ${memberYear}
            ${siteRecord?.description ? `· ${siteRecord.description}` : ""}
          </div>
        </div>
        <a class="profile-lichess-link"
           href="https://lichess.org/@/${encodeURIComponent(user.username)}"
           target="_blank" rel="noopener noreferrer">View on Lichess ↗</a>
      </div>`;

    // Stats
    statsGridEl.innerHTML =
      statItem("Current Rating", curRating || "N/A", true) +
      statItem("Peak Rating", peakRating || "N/A") +
      statItem("Leaderboard", rank) +
      statItem("Total Games", games.toLocaleString()) +
      statItem("Wins", wins.toLocaleString()) +
      statItem("Losses", losses.toLocaleString()) +
      statItem("Draws", draws.toLocaleString()) +
      statItem("Win Rate", winRate) +
      (bestStreak != null ? statItem("Best Streak", bestStreak) : "");

    // Site titles
    if (siteTitleList.length > 0) {
      siteTitlesEl.innerHTML = `<div class="site-titles-list">` +
        siteTitleList.map(t => {
          const cls = BADGE_MAP[t.code] || "badge-veteran";
          return `<span class="site-title-badge ${cls}">${t.code}<span class="since-label">${t.date ? "· " + t.date : ""}</span></span>`;
        }).join("") + `</div>`;
    } else {
      siteTitlesEl.innerHTML = `<p class="no-titles">No site titles held yet.</p>`;
    }

    // Eligibility
    eligListEl.innerHTML = TITLE_DEFS.map((def, i) => {
      const gamesDone  = games >= def.minGames;
      const ratingDone = def.minRating === 0 || peakRating >= def.minRating;
      const bothMet    = gamesDone && ratingDone;

      const gamesRow  = progressRow(
        def.minRating === 0 ? "Games (10,000 OR 5-year account)" : "Minimum games",
        games, def.minGames
      );
      const ratingRow = def.minRating > 0
        ? progressRow("Peak rating required", peakRating, def.minRating)
        : `<div class="elig-req-row">
            <div class="elig-req-label">
              <span class="elig-req-text">5-year account age also qualifies</span>
              <span class="elig-req-val unmet">manual check</span>
            </div>
          </div>`;

      return `${i > 0 ? '<hr class="elig-divider">' : ""}
        <div class="elig-item">
          <div class="elig-header">
            <span class="elig-badge ${def.badgeClass}">${def.code}</span>
            <span class="elig-title-name">${def.name}</span>
            <span class="elig-check ${bothMet ? "met" : "unmet"}">
              ${bothMet ? "✓ Base reqs met" : "Not yet eligible"}
            </span>
          </div>
          <div class="elig-reqs">${gamesRow}${ratingRow}</div>
        </div>`;
    }).join("");

    output.hidden = false;
    setStatus(`Loaded profile for ${user.username}.`);
  } catch (err) {
    setStatus(err.message || "Failed to load profile.", true);
  } finally {
    loadBtn.disabled = false;
  }
}

form.addEventListener("submit", e => { e.preventDefault(); loadProfile(input.value); });

const saved = localStorage.getItem(STORAGE_KEY);
if (saved) { input.value = saved; loadProfile(saved); }
</script>

<script src="js/menu.js"></script>
</body>
</html>
