<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Racing Kings Titles - Titles</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .titles-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 1.5rem;
    }

    .title-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      animation: fadeInUp 0.4s ease both;
    }

    .title-card:nth-child(1) { animation-delay: 0.05s; }
    .title-card:nth-child(2) { animation-delay: 0.1s; }
    .title-card:nth-child(3) { animation-delay: 0.15s; }
    .title-card:nth-child(4) { animation-delay: 0.2s; }
    .title-card:nth-child(5) { animation-delay: 0.25s; }
    .title-card:nth-child(6) { animation-delay: 0.3s; }
    .title-card:nth-child(7) { animation-delay: 0.35s; }
    .title-card:nth-child(8) { animation-delay: 0.4s; }

    .title-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .title-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      flex-wrap: wrap;
    }

    .title-badge-large {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .title-badge-large:hover { transform: scale(1.05); }

    .badge-elite     { background: #7c3aed; color: #fff; }
    .badge-grand     { background: #dc2626; color: #fff; }
    .badge-master    { background: #2563eb; color: #fff; }
    .badge-candidate { background: #0891b2; color: #fff; }
    .badge-clight    { background: #0f766e; color: #fff; }
    .badge-special   { background: #f59e0b; color: #000; }
    .badge-veteran   { background: #6b7280; color: #fff; }

    .title-name-block { flex: 1; min-width: 0; }

    .title-full-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 0.15rem;
    }

    .title-holder-count {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .title-holder-count strong { color: var(--gold); }

    .title-card-body {
      padding: 0 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .title-reqs {
      margin: 0.85rem 0 0;
      padding-left: 1.2rem;
      list-style: disc;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .title-reqs li {
      color: var(--text-soft);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .holders-section { margin-top: 1rem; }

    .holders-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .holders-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .holder-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.22rem 0.7rem;
      font-size: 0.82rem;
      color: var(--text-soft);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }

    .holder-chip:hover {
      border-color: var(--border-hover);
      color: var(--accent);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .no-holders {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    @media (max-width: 600px) {
      .title-card-header { gap: 0.75rem; }
      .title-badge-large { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="nav-left"></div>
  <div class="nav-right">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
  </div>
</header>

<nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>

<main>
  <h1>Titles</h1>
  <p class="subtitle">All official Racing Kings titles, their requirements, and current holders.</p>
  <div class="titles-grid" id="titlesGrid"></div>
</main>

<script>
const TITLES = [
  {
    code: "RKWC",
    name: "Racing Kings World Champion",
    badgeClass: "badge-special",
    reqs: ["Have won at least one RKWC (Racing Kings World Championship)"]
  },
  {
    code: "RKSGM",
    name: "Racing Kings Super Grandmaster",
    badgeClass: "badge-elite",
    reqs: [
      "5000 or more rated RK games",
      "Have reached 2500 rating",
      "2 rated RK tournament wins with at least 10 games and a performance of at least 2400",
      "5 rated RK tournament performances of at least 2400 with a minimum of 10 games",
      "1 RK Shield win"
    ]
  },
  {
    code: "RKGM",
    name: "Racing Kings Grandmaster",
    badgeClass: "badge-grand",
    reqs: [
      "3000 or more rated RK games",
      "Have reached 2400 rating",
      "1 rated RK tournament win with at least 10 games and a performance of at least 2400",
      "3 rated RK tournament performances of at least 2400 with a minimum of 10 games"
    ]
  },
  {
    code: "RKIM",
    name: "Racing Kings International Master",
    badgeClass: "badge-master",
    reqs: [
      "2000 or more rated RK games",
      "Have reached 2300 rating",
      "3 rated RK tournament wins with at least 10 games and performances of at least 2300"
    ]
  },
  {
    code: "RKM",
    name: "Racing Kings Master",
    badgeClass: "badge-candidate",
    reqs: [
      "1000 or more rated RK games",
      "Have reached 2200 rating",
      "3 rated RK tournament wins with at least 10 games and performances of at least 2200"
    ]
  },
  {
    code: "RKCM",
    name: "Racing Kings Candidate Master",
    badgeClass: "badge-clight",
    reqs: [
      "500 or more rated RK games",
      "Have reached 2100 rating",
      "3 rated RK tournament wins with at least 10 games and performances of at least 2100"
    ]
  },
  {
    code: "RKV",
    name: "Racing Kings Veteran",
    badgeClass: "badge-veteran",
    reqs: [
      "10000 or more rated RK games",
      "Or have been playing RK for at least 5 years"
    ]
  },
  {
    code: "RKHM",
    name: "Racing Kings Honorary Master",
    badgeClass: "badge-special",
    reqs: ["Have accomplished something great for the RK community (must be recognized)"]
  }
];

async function loadTitles() {
  let players = [];
  try {
    const res = await fetch("players.json");
    players = await res.json();
  } catch (_) {}

  const holderMap = {};
  players.forEach(player => {
    (player.titles || []).forEach(t => {
      const code = String(t.code || "").trim().toUpperCase();
      if (!holderMap[code]) holderMap[code] = [];
      holderMap[code].push(player.username);
    });
  });

  const grid = document.getElementById("titlesGrid");

  TITLES.forEach(title => {
    const holders = holderMap[title.code] || [];
    const count = holders.length;

    const holdersHTML = count > 0
      ? holders.map(u => `
          <a class="holder-chip"
             href="https://lichess.org/@/${encodeURIComponent(u)}"
             target="_blank" rel="noopener noreferrer">${u}</a>`).join("")
      : `<span class="no-holders">No current holders</span>`;

    const card = document.createElement("div");
    card.className = "title-card";
    card.innerHTML = `
      <div class="title-card-header">
        <span class="title-badge-large ${title.badgeClass}">${title.code}</span>
        <div class="title-name-block">
          <div class="title-full-name">${title.name}</div>
          <div class="title-holder-count">
            <strong>${count}</strong> current holder${count !== 1 ? "s" : ""}
          </div>
        </div>
      </div>
      <div class="title-card-body">
        <ul class="title-reqs">
          ${title.reqs.map(r => `<li>${r}</li>`).join("")}
        </ul>
        <div class="holders-section">
          <div class="holders-label">Current holders</div>
          <div class="holders-list">${holdersHTML}</div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

loadTitles();
</script>

<script src="js/menu.js"></script>
</body>
</html>
