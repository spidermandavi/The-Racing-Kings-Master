<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Racing Kings Titles</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.9rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="nav-left">
      <button class="icon-btn" id="backBtn" aria-label="Go back">&lt;</button>
      <button class="icon-btn" id="forwardBtn" aria-label="Go forward">&gt;</button>
    </div>
    <div class="nav-right">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
    </div>
  </header>

  <nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>

  <main>
    <h1>Racing Kings Titles</h1>
    <p class="subtitle">
      Choose a section to explore players, profiles, titles,
      and background information about Racing Kings Titles.
    </p>
    <section class="grid" id="optionsGrid"></section>
  </main>

  <script>
    const pages = [
      { slug: "players",    label: "Players",    desc: "View leaderboards, players and rankings." },
      { slug: "leaderboard",label: "Leaderboard",desc: "Browse titled Racing Kings players." },
      { slug: "profile",    label: "Profiles",   desc: "Look up any player's stats and eligibility." },
      { slug: "search",     label: "Search",     desc: "Check title eligibility for any player." },
      { slug: "titles",     label: "Titles",     desc: "All titles, requirements, and current holders." },
      { slug: "about",      label: "About",      desc: "Learn what Racing Kings Titles is about." }
    ];

    const grid = document.getElementById("optionsGrid");
    pages.forEach(page => {
      const card = document.createElement("a");
      card.href = `${page.slug}.html`;
      card.className = "option";
      card.innerHTML = `<h2>${page.label}</h2><p>${page.desc}</p>`;
      grid.appendChild(card);
    });
  </script>

  <script src="js/menu.js"></script>
</body>
</html>
