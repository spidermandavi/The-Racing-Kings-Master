<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — The Racing Kings Master</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/logo.css">
  <link rel="stylesheet" href="css/category-menu.css">
</head>
<body>
<header class="top-bar"><div class="nav-left"><a class="rk-brand" href="index.html" aria-label="The Racing Kings Master — Home"></a></div><div class="nav-right"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button></div></header>
<nav id="menuPanel" class="menu-panel" aria-label="Site menu"></nav>
<main class="category-main">
  <section class="category-hero"><span class="category-eyebrow">♛ Category</span><h1 class="category-title">Account</h1><p class="category-description">Access your profile, community tools, and account settings.</p></section>
  <div id="accountStatus" class="category-status">Loading account options…</div><div id="accountOptions" class="category-grid" aria-label="Account options"></div>
  <section class="category-grid" aria-label="Account options"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/menu.js"></script>

<script>
(function(){
  const status=document.getElementById('accountStatus'),grid=document.getElementById('accountOptions');
  function card(href,icon,title,text){return '<a class="category-card" href="'+href+'"><span class="category-card-icon">'+icon+'</span><h2>'+title+'</h2><p>'+text+'</p><span class="category-card-arrow">→</span></a>';}
  async function render(){
    try{
      const user=await window.rkAuth.user();
      if(!user){status.textContent='You are currently signed out.';grid.innerHTML=card('auth.html','🔐','Login / Register','Sign in or create your Racing Kings Master account.');return;}
      const safeName=String(user.username||'Member').replace(/[<>&"]/g,'');
      status.innerHTML='Signed in as <strong>'+safeName+'</strong>';
      let html=card('profile.html?u='+encodeURIComponent(user.username),'👤','My Profile','View your Racing Kings profile, ratings, and title information.')+
        card('chat.html','💬','Chat','Open the site community chat.')+
        card('settings.html','⚙','Settings','Manage your account and preferences.');
      if(user.is_admin){
        html+=card('admin.html','🛡','Admin Panel','Manage site administration tools and title applications.')+
          card('player-specific-training.html?route=player-stats','🎯','Player Specific Training','Open the admin-only player training and analysis tools.');
      }
      grid.innerHTML=html;
    }catch(e){
      console.error('Could not load account options:',e);
      status.textContent='Account options could not be loaded.';
      grid.innerHTML=card('auth.html','🔐','Login / Register','Open the account page and try signing in again.');
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render();
})();
</script></body>
</html>
