<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>The Racing Kings Master - Login</title><link rel="stylesheet" href="css/global.css"><style>.auth-wrap{display:grid;place-items:center;padding:1rem}.auth-card{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2rem;animation:fadeInUp .4s ease both}.auth-logo{text-align:center;margin-bottom:1.5rem}.auth-logo h1{font-size:1.4rem;margin-bottom:.2rem}.auth-logo p{font-size:.85rem;color:var(--text-muted)}.tab-bar{display:flex;border-radius:10px;background:var(--surface);padding:4px;gap:4px;margin-bottom:1.5rem}.tab-btn{flex:1;padding:.55rem;border:none;border-radius:8px;background:transparent;color:var(--text-muted);font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer}.tab-btn.active{background:var(--card-raised);color:var(--text)}.tab-panel{display:none}.tab-panel.active{display:block;animation:fadeIn .2s ease}.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}.field label{font-size:.82rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}.field input{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);font-size:.95rem;font-family:inherit;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.submit-btn{width:100%;padding:.8rem;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;margin-top:.25rem}.submit-btn:disabled{opacity:.55;cursor:progress}.error-msg,.success-msg{margin-top:.75rem;padding:.6rem .9rem;border-radius:8px;font-size:.88rem;display:none}.error-msg{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:#f87171}.success-msg{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80}.error-msg.show,.success-msg.show{display:block}.hint{font-size:.8rem;color:var(--text-muted);margin-top:.3rem;line-height:1.5}.back-link{display:block;text-align:center;font-size:.85rem;color:var(--text-muted);text-decoration:none;margin-top:1rem}</style></head><body><header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button></div></header><nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav><main class="auth-wrap"><div class="auth-card"><div class="auth-logo"><h1>The Racing Kings Master</h1><p>Sign in or create a site account</p></div><div class="tab-bar"><button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button><button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register</button></div><div class="tab-panel active" id="loginPanel"><form id="loginForm" onsubmit="handleLogin(event)"><div class="field"><label for="loginUser">Email</label><input id="loginUser" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Your site password" required></div><button class="submit-btn" id="loginBtn" type="submit">Login</button></form><div class="error-msg" id="loginError"></div><div class="success-msg" id="loginSuccess"></div></div><div class="tab-panel" id="registerPanel"><form id="registerForm" onsubmit="handleRegister(event)"><div class="field"><label for="regUser">Lichess username</label><input id="regUser" type="text" autocomplete="username" placeholder="e.g. Mysterious_Past" required><span class="hint">Must match your Lichess username exactly.</span></div><div class="field"><label for="regEmail">Email</label><input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" required><span class="hint">Used for login and account verification.</span></div><div class="field"><label for="regPass">Password</label><input id="regPass" type="password" autocomplete="new-password" placeholder="At least 6 characters" required></div><div class="field"><label for="regConfirm">Confirm password</label><input id="regConfirm" type="password" autocomplete="new-password" placeholder="Repeat password" required></div><button class="submit-btn" id="registerBtn" type="submit">Create account</button></form><div class="error-msg" id="registerError"></div><div class="success-msg" id="registerSuccess"></div></div><a class="back-link" href="index.html">← Back to Home</a></div></main><script>function switchTab(tab){document.getElementById('loginPanel').classList.toggle('active',tab==='login');document.getElementById('registerPanel').classList.toggle('active',tab==='register');document.getElementById('loginTab').classList.toggle('active',tab==='login');document.getElementById('registerTab').classList.toggle('active',tab==='register')}function showErr(id,msg){const el=document.getElementById(id);el.textContent=msg;el.className='error-msg show'}function showOk(id,msg){const el=document.getElementById(id);el.textContent=msg;el.className='success-msg show'}function hideMsg(id){document.getElementById(id).className=document.getElementById(id).className.replace(/ ?show/,'')}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth-supabase.js"></script><script src="js/menu.js"></script></body></html>
