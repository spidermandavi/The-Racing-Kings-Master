<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player Specific Training – The Racing Kings Master</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <header class="top-bar">
    <div class="nav-left"></div>
    <div class="nav-right">
      <button class="icon-btn" id="menuBtn" type="button">☰ Menu</button>
    </div>
  </header>

  <nav id="menuPanel" class="menu-panel"></nav>

  <main>
    <section class="page-head">
      <div>
        <span class="eyebrow">ADMIN ONLY</span>
        <h1>Player Specific Training</h1>
        <p class="subtitle">This section is being rebuilt from scratch.</p>
      </div>
    </section>

    <section class="panel" id="placeholderCard" hidden>
      <h2>Coming soon</h2>
      <p>The previous player-specific training system has been removed so this page can be rebuilt cleanly.</p>
    </section>

    <div id="accessState" class="access-card" aria-live="polite">Checking administrator permissions…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/menu.js"></script>
  <script>
    (async function () {
      const accessState = document.getElementById('accessState');
      const placeholderCard = document.getElementById('placeholderCard');

      try {
        const user = await window.rkAuth.user();

        if (!user || !user.is_admin) {
          accessState.textContent = 'This page is only available to administrators.';
          return;
        }

        accessState.hidden = true;
        placeholderCard.hidden = false;
      } catch (error) {
        console.error('Could not verify administrator permissions:', error);
        accessState.textContent = 'Could not verify administrator permissions. Please sign in again.';
      }
    })();
  </script>
</body>
</html>
