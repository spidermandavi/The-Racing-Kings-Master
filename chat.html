<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat – The Racing Kings Master</title><link rel="stylesheet" href="css/global.css"><style>main{max-width:900px}.chat{height:65vh;min-height:420px;display:grid;grid-template-columns:220px 1fr;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}.side{border-right:1px solid var(--border);overflow:auto}.person{padding:.8rem 1rem;border-bottom:1px solid var(--border);cursor:pointer}.person:hover,.person.active{background:rgba(139,92,246,.1)}.mainchat{display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}.bubble{max-width:72%;padding:.55rem .8rem;border-radius:13px;background:var(--card-raised)}.mine{align-self:flex-end;background:var(--accent);color:#fff}.input{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--border)}.input textarea{flex:1;resize:none;padding:.65rem;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text)}button{padding:.65rem 1rem;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit}@media(max-width:650px){.chat{grid-template-columns:1fr}.side{max-height:150px;border-right:0;border-bottom:1px solid var(--border)}} </style></head><body><header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn">☰ Menu</button></div></header><nav id="menuPanel" class="menu-panel"></nav><main><h1>Chat</h1><p class="subtitle">Direct messages with the admin team.</p><div id="root">Loading…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/menu.js"></script><script>
let me=null,partner=null;const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};async function init(){me=await rkAuth.user();const root=document.getElementById('root');if(!me){root.innerHTML='<p>You must be logged in. <a href="auth.html">Login / Register</a></p>';return}const {data:admins}=await rkSupabase.from('profiles').select('id,username').eq('is_admin',true).order('username');const {data:users}=me.is_admin?await rkSupabase.from('profiles').select('id,username').neq('id',me.id).order('username'):{data:[]};const people=me.is_admin?users:(admins||[]);root.innerHTML='<div class="chat"><div class="side" id="people">'+people.map(p=>'<div class="person" data-id="'+p.id+'" onclick="openChat(\''+p.id+'\',\''+esc(p.username)+'\')">'+esc(p.username)+(p.is_admin?'':'')+'</div>').join('')+'</div><div class="mainchat" id="mainchat"><div class="messages" id="messages">Select a conversation.</div></div></div>';if(people.length)openChat(people[0].id,people[0].username)}async function openChat(id,name){partner={id,name};document.querySelectorAll('.person').forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.getElementById('mainchat').innerHTML='<div style="padding:.8rem;border-bottom:1px solid var(--border);font-weight:700">'+esc(name)+'</div><div class="messages" id="messages"></div><div class="input"><textarea id="msg" rows="1" placeholder="Write a message…"></textarea><button onclick="sendMsg()">Send</button></div>';await loadMessages()}async function loadMessages(){if(!partner)return;const {data,error}=await rkSupabase.from('chat_messages').select('id,from_user,to_user,body,sent_at').or('and(from_user.eq.'+me.id+',to_user.eq.'+partner.id+'),and(from_user.eq.'+partner.id+',to_user.eq.'+me.id+')').order('sent_at');const box=document.getElementById('messages');if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.from_user===me.id?'mine':'')+'">'+esc(m.body)+'<div style="font-size:.65rem;opacity:.7;margin-top:3px">'+new Date(m.sent_at).toLocaleString()+'</div></div>').join('')||'<div style="margin:auto;color:var(--text-muted)">No messages yet.</div>';box.scrollTop=box.scrollHeight;await rkSupabase.from('chat_messages').update({read_at:new Date().toISOString()}).eq('to_user',me.id).eq('from_user',partner.id).is('read_at',null)}async function sendMsg(){const el=document.getElementById('msg'),body=el.value.trim();if(!body||!partner)return;const {error}=await rkSupabase.from('chat_messages').insert({from_user:me.id,to_user:partner.id,body});if(error){alert(error.message);return}el.value='';await loadMessages()}init();setInterval(()=>{if(partner)loadMessages()},5000);
</script></body></html>
