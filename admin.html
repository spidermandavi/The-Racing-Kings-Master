<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel – The Racing Kings Master</title><link rel="stylesheet" href="css/global.css"><style>main{max-width:1000px}.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.2rem;margin:1rem 0}.item{padding:.8rem 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}button{padding:.5rem .8rem;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer;margin:.2rem}.danger{background:#7f1d1d}.muted{color:var(--text-muted)}</style></head><body><header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn">☰ Menu</button></div></header><nav id="menuPanel" class="menu-panel"></nav><main><h1>Admin Panel</h1><p class="subtitle">Manage Racing Kings Master accounts and title applications.</p><div id="root">Checking permissions…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/menu.js"></script><script>
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};async function init(){const me=await rkAuth.user(),root=document.getElementById('root');if(!me?.is_admin){root.innerHTML='<div class="box">Access denied. <a href="index.html">Return home</a></div>';return}const [{data:apps},{data:reqs},{data:users},{data:news}]=await Promise.all([rkSupabase.from('title_applications').select('*,profiles!title_applications_user_id_fkey(username)').order('submitted_at',{ascending:false}),rkSupabase.from('username_change_requests').select('*,profiles!username_change_requests_user_id_fkey(username)').order('requested_at',{ascending:false}),rkSupabase.from('profiles').select('id,username,is_admin,country,created_at').order('username'),rkSupabase.from('news').select('*').order('published_at',{ascending:false})]);root.innerHTML='<div class="box"><h2>Title applications</h2>'+((apps||[]).map(a=>'<div class="item"><strong>'+esc(a.profiles?.username||'Unknown')+'</strong> — '+esc(a.title_code)+' — '+esc(a.status)+'<br><span class="muted">'+esc(a.message)+'</span><br>'+(a.status==='pending'?'<button onclick="reviewApp('+a.id+',\'approved\')">Approve</button><button class="danger" onclick="reviewApp('+a.id+',\'denied\')">Deny</button>':'')+'</div>').join('')||'<p class="muted">No applications.</p>')+'</div><div class="box"><h2>Username requests</h2>'+((reqs||[]).map(r=>'<div class="item"><strong>'+esc(r.profiles?.username||'Unknown')+'</strong> → '+esc(r.new_username)+' — '+esc(r.status)+(r.status==='pending'?'<br><button onclick="approveName('+r.id+')">Approve</button><button class="danger" onclick="reviewName('+r.id+',\'denied\')">Deny</button>':'')+'</div>').join('')||'<p class="muted">No requests.</p>')+'</div><div class="box"><h2>Members</h2>'+((users||[]).map(u=>'<div class="item"><strong>'+esc(u.username)+'</strong> '+(u.is_admin?'👑 Admin':'Member')+'</div>').join('')||'<p class="muted">No profiles.</p>')+'</div><div class="box"><h2>News</h2><p class="muted">News remains managed through Supabase and can be extended here without a backend.</p>'+((news||[]).map(n=>'<div class="item"><strong>'+esc(n.title)+'</strong><br><span class="muted">'+esc(n.category)+'</span></div>').join(''))+'</div>'}async function reviewApp(id,status){const {error}=await rkSupabase.from('title_applications').update({status,reviewed_at:new Date().toISOString(),reviewed_by:(await rkAuth.user()).id}).eq('id',id);if(error)alert(error.message);else location.reload()}async function approveName(id){const {error}=await rkSupabase.rpc('approve_username_request',{request_id:id});if(error)alert(error.message);else location.reload()}async function reviewName(id,status){const me=await rkAuth.user();const {error}=await rkSupabase.from('username_change_requests').update({status,reviewed_at:new Date().toISOString(),reviewed_by:me.id}).eq('id',id);if(error)alert(error.message);else location.reload()}init();
</script></body></html>
