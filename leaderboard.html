<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RK Leaderboard</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>

<header class="top-bar">
  <div class="nav-left"></div>
  <div class="nav-right">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
  </div>
</header>

<nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>

<main>
  <div class="leaderboard-heading">
    <div>
      <p class="eyebrow">RACING KINGS ARENA</p>
      <h1>Titled Player Leaderboard</h1>
      <p class="subtitle">The official ranking for Racing Kings players, titles, and competitive form.</p>
    </div>
    <div class="leaderboard-summary" id="leaderboardSummary" aria-label="Leaderboard summary"></div>
  </div>

  <div class="filter-bar leaderboard-toolbar">
    <label class="search-field" aria-label="Search players">
      <span aria-hidden="true">⌕</span>
      <input id="playerSearch" type="search" placeholder="Search players..." autocomplete="off" />
    </label>
    <div class="filter-group">
      <select id="sortFilter" aria-label="Sort leaderboard">
      <option value="titles">Order by Titles</option>
      <option value="rating">Order by Rating</option>
      </select>
      <select id="titleFilter" aria-label="Filter by title">
      <option value="ALL">All Titles</option>
      <option value="RKWC">RKWC Only</option>
      <option value="RKSGM">RKSGM Only</option>
      <option value="RKGM">RKGM Only</option>
      <option value="RKIM">RKIM Only</option>
      <option value="RKM">RKM Only</option>
      <option value="RKCM">RKCM Only</option>
      <option value="RKV">RKV Only</option>
      <option value="RKHM">RKHM Only</option>
      </select>
    </div>
    <label class="toggle-pill" for="memberFilter" title="Show only registered site members">
      <input type="checkbox" id="memberFilter" />
      <span>Members only</span>
    </label>
  </div>

  <div id="leaderboard"></div>
</main>

<script src="leaderboard.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
