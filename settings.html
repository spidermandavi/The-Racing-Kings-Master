<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings – The Racing Kings Master</title><link rel="stylesheet" href="css/global.css"><style>main{max-width:700px}.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem;margin:1rem 0}.row{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.field{display:flex;flex-direction:column;gap:.4rem;margin:.8rem 0}.field input{padding:.7rem;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text)}button{padding:.65rem 1rem;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}.muted{color:var(--text-muted)}</style></head><body><header class="top-bar"><div class="nav-left"></div><div class="nav-right"><button class="icon-btn" id="menuBtn">☰ Menu</button></div></header><nav id="menuPanel" class="menu-panel"></nav><main><h1>Settings</h1><p class="subtitle">Manage your account and preferences.</p><div id="body"><div class="box muted">Loading…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/menu.js"></script><script>
(async()=>{const u=await rkAuth.user(),b=document.getElementById('body');if(!u){b.innerHTML='<div class="box">You are not logged in.<br><br><a href="auth.html">Login / Register</a></div>';return}const {data:apps}=await rkSupabase.from('title_applications').select('*').eq('user_id',u.id).order('submitted_at',{ascending:false});const {data:notifs}=await rkSupabase.from('notifications').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(20);b.innerHTML='<div class="box"><h2>Account</h2><div class="row"><span class="muted">Username</span><strong>'+esc(u.username)+'</strong></div><div class="row"><span class="muted">Role</span><strong>'+(u.is_admin?'Admin':'Member')+'</strong></div><div class="row"><span class="muted">Email</span><span>'+esc(u.email||'')+'</span></div></div><div class="box"><h2>Appearance</h2><div class="row"><span>Theme</span><button onclick="toggleTheme()">Toggle</button></div></div><div class="box"><h2>Request username change</h2><div class="field"><input id="newName" maxlength="40" placeholder="New username"></div><button onclick="requestName()">Submit request</button><p id="nameMsg" class="muted"></p></div><div class="box"><h2>My title applications</h2>'+((apps||[]).map(a=>'<div class="row"><span>'+esc(a.title_code)+'</span><span>'+esc(a.status)+'</span></div>').join('')||'<p class="muted">No applications.</p>')+'</div><div class="box"><h2>Notifications</h2>'+((notifs||[]).map(n=>'<div class="row"><span>'+esc(n.body)+'</span></div>').join('')||'<p class="muted">No notifications.</p>')+'</div><div class="box"><button onclick="rkSupabase.auth.signOut().then(()=>location.href=\'index.html\')">Log out</button></div>';if(notifs?.length)await rkSupabase.from('notifications').update({read:true}).eq('user_id',u.id)})();function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function toggleTheme(){const n=(document.documentElement.getAttribute('data-theme')||'dark')==='dark'?'light':'dark';localStorage.setItem('rk-theme',n);document.documentElement.setAttribute('data-theme',n)}async function requestName(){const n=document.getElementById('newName').value.trim(),m=document.getElementById('nameMsg'),u=await rkAuth.user();if(!n){m.textContent='Enter a username.';return}const {error}=await rkSupabase.from('username_change_requests').insert({user_id:u.id,new_username:n});m.textContent=error?error.message:'Request submitted for admin approval.'}</script></body></html>
