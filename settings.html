<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – The Racing Kings Master</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    main { max-width: 700px; }

    .settings-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.25rem;
    }

    .settings-section h2 {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.9rem;
    }
    .field:last-child { margin-bottom: 0; }

    .field label {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field input {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .field-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }
    .field-row .field { flex: 1; margin-bottom: 0; }

    .submit-btn {
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    .submit-btn:active { transform: scale(0.97); }
    .submit-btn:disabled { opacity: 0.5; cursor: progress; }

    .msg {
      margin-top: 0.65rem;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      font-size: 0.87rem;
      display: none;
    }
    .msg.ok  { background: rgba(74,222,128,.1); border:1px solid rgba(74,222,128,.25); color:#4ade80; display:block; }
    .msg.err { background: rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.25); color:#f87171; display:block; }

    /* Theme toggle row */
    .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
    }
    .theme-row span { font-size: 0.95rem; color: var(--text-soft); }

    .toggle-track {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-track.on { background: var(--accent); border-color: var(--accent); }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(20px); }

    .profile-stat {
      display: flex;
      justify-content: space-between;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.93rem;
    }
    .profile-stat:last-child { border-bottom: none; }
    .profile-stat .key { color: var(--text-muted); }
    .profile-stat .val { font-weight: 600; }

    .app-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      flex-wrap: wrap;
    }
    .app-row:last-child { border-bottom: none; }
    .app-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-pending  { background: rgba(251,191,36,.15); color:#fbbf24; border:1px solid rgba(251,191,36,.3); }
    .badge-approved { background: rgba(74,222,128,.15);  color:#4ade80; border:1px solid rgba(74,222,128,.3); }
    .badge-denied   { background: rgba(248,113,113,.15); color:#f87171; border:1px solid rgba(248,113,113,.3); }

    .not-logged {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .not-logged a { color: var(--accent); }

    @media (max-width: 500px) {
      .field-row { flex-direction: column; }
      .submit-btn { width: 100%; }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="nav-left"></div>
  <div class="nav-right">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
  </div>
</header>

<nav id="menuPanel" class="menu-panel" aria-label="Quick Menu"></nav>

<main>
  <h1>Settings</h1>
  <p class="subtitle">Manage your account, appearance, and preferences.</p>

  <div id="settingsBody">
    <div class="settings-section">
      <p style="color:var(--text-muted);font-size:.9rem">Loading…</p>
    </div>
  </div>
</main>

<script>
let _me = null;

async function loadSettings() {
  const res  = await fetch("/api/auth/me");
  const data = await res.json();
  _me = data.user;

  const body = document.getElementById("settingsBody");

  if (!_me) {
    body.innerHTML = `
      <div class="not-logged">
        <p style="font-size:1.1rem;margin-bottom:.75rem">You are not logged in.</p>
        <a href="auth.html" class="submit-btn" style="display:inline-block;text-decoration:none">Login / Register</a>
      </div>`;
    return;
  }

  // Load applications for this user
  const appsRes = await fetch("/api/applications/mine");
  const apps    = appsRes.ok ? await appsRes.json() : [];

  // Load notifications
  const notifRes = await fetch("/api/notifications");
  const notifs   = notifRes.ok ? await notifRes.json() : [];
  // Mark all notifications read
  fetch("/api/notifications/read", { method: "POST" });

  const savedTheme = localStorage.getItem("rk-theme") || "dark";
  const isLight    = savedTheme === "light";

  body.innerHTML = `
    <!-- Profile info -->
    <div class="settings-section">
      <h2>Your Account</h2>
      <div class="profile-stat"><span class="key">Username</span><span class="val" id="dispUsername">${escHtml(_me.username)}</span></div>
      <div class="profile-stat"><span class="key">Role</span><span class="val">${_me.is_admin ? "Admin" : "Member"}</span></div>
      <div class="profile-stat">
        <span class="key">Lichess Profile</span>
        <span class="val"><a href="https://lichess.org/@/${encodeURIComponent(_me.username)}" target="_blank" rel="noopener" style="color:var(--accent)">View on Lichess ↗</a></span>
      </div>
      <div class="profile-stat">
        <span class="key">Site Profile</span>
        <span class="val"><a href="profile.html?u=${encodeURIComponent(_me.username)}" style="color:var(--accent)">View Profile</a></span>
      </div>
    </div>

    <!-- Appearance -->
    <div class="settings-section">
      <h2>Appearance</h2>
      <div class="theme-row">
        <span>Light mode</span>
        <div class="toggle-track ${isLight ? 'on' : ''}" id="themeTrack" onclick="toggleTheme()">
          <div class="toggle-thumb"></div>
        </div>
      </div>
    </div>

    <!-- Change Password -->
    <div class="settings-section">
      <h2>Change Password</h2>
      <div class="field">
        <label>Current Password</label>
        <input type="password" id="curPw" autocomplete="current-password" placeholder="Your current password" />
      </div>
      <div class="field">
        <label>New Password</label>
        <input type="password" id="newPw" autocomplete="new-password" placeholder="At least 6 characters" />
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" id="confPw" autocomplete="new-password" placeholder="Repeat new password" />
      </div>
      <button class="submit-btn" id="pwBtn" onclick="changePassword()">Update Password</button>
      <div class="msg" id="pwMsg"></div>
    </div>

    <!-- Request username change -->
    <div class="settings-section">
      <h2>Request Username Change</h2>
      <p style="font-size:.875rem;color:var(--text-muted);margin-bottom:.9rem">
        Username changes require admin approval. Your current username is <strong style="color:var(--text)">${escHtml(_me.username)}</strong>.
      </p>
      <div class="field-row">
        <div class="field">
          <label>New Username</label>
          <input type="text" id="newUname" placeholder="Desired new username" maxlength="40" />
        </div>
        <button class="submit-btn" id="unameBtn" onclick="requestUsernameChange()">Request</button>
      </div>
      <div class="msg" id="unameMsg"></div>
    </div>

    <!-- Title Applications -->
    <div class="settings-section">
      <h2>My Title Applications</h2>
      ${apps.length === 0
        ? `<p style="color:var(--text-muted);font-size:.9rem">No applications yet.</p>`
        : apps.map(a => `
          <div class="app-row">
            <span><strong>${escHtml(a.title_code)}</strong> — submitted ${fmtDate(a.submitted_at)}</span>
            <span class="app-badge badge-${a.status}">${a.status}</span>
            ${a.review_note ? `<span style="color:var(--text-muted);font-size:.82rem;width:100%">Note: ${escHtml(a.review_note)}</span>` : ''}
          </div>`).join("")
      }
    </div>

    <!-- Notifications -->
    <div class="settings-section">
      <h2>Recent Notifications</h2>
      ${notifs.length === 0
        ? `<p style="color:var(--text-muted);font-size:.9rem">No notifications.</p>`
        : notifs.slice(0, 20).map(n => `
          <div class="app-row">
            <span style="flex:1">${escHtml(n.body)}</span>
            <span style="color:var(--text-muted);font-size:.78rem;white-space:nowrap">${fmtDate(n.created_at)}</span>
          </div>`).join("")
      }
    </div>

    <!-- Danger zone -->
    <div class="settings-section">
      <h2>Session</h2>
      <button class="submit-btn" style="background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)" onclick="logout()">Log Out</button>
    </div>
  `;
}

function escHtml(s) {
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }); }
  catch { return iso; }
}

function toggleTheme() {
  const track = document.getElementById("themeTrack");
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("rk-theme", next);
  document.documentElement.setAttribute("data-theme", next);
  if (track) track.classList.toggle("on", next === "light");
}

async function changePassword() {
  const btn  = document.getElementById("pwBtn");
  const msg  = document.getElementById("pwMsg");
  const cur  = document.getElementById("curPw").value;
  const np   = document.getElementById("newPw").value;
  const conf = document.getElementById("confPw").value;
  msg.className = "msg";

  if (!cur || !np || !conf) { showMsg("pwMsg", "All fields are required.", "err"); return; }
  if (np !== conf)           { showMsg("pwMsg", "New passwords do not match.", "err"); return; }
  if (np.length < 6)         { showMsg("pwMsg", "New password must be at least 6 characters.", "err"); return; }

  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const res  = await fetch("/api/settings/password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_password: cur, new_password: np })
    });
    const data = await res.json();
    if (!res.ok) { showMsg("pwMsg", data.error || "Failed.", "err"); return; }
    showMsg("pwMsg", "Password updated successfully!", "ok");
    document.getElementById("curPw").value = "";
    document.getElementById("newPw").value = "";
    document.getElementById("confPw").value = "";
  } finally {
    btn.disabled = false; btn.textContent = "Update Password";
  }
}

async function requestUsernameChange() {
  const btn  = document.getElementById("unameBtn");
  const val  = (document.getElementById("newUname").value || "").trim();
  if (!val) { showMsg("unameMsg", "Please enter a new username.", "err"); return; }

  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const res  = await fetch("/api/settings/username-request", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ new_username: val })
    });
    const data = await res.json();
    if (!res.ok) { showMsg("unameMsg", data.error || "Failed.", "err"); return; }
    showMsg("unameMsg", "Request submitted! An admin will review it.", "ok");
    document.getElementById("newUname").value = "";
  } finally {
    btn.disabled = false; btn.textContent = "Request";
  }
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = `msg ${type}`;
}

async function logout() {
  await fetch("/api/auth/logout", { method: "POST" });
  window.location.href = "index.html";
}

loadSettings();
</script>

<script src="js/menu.js"></script>
</body>
</html>
